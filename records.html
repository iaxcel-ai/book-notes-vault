<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="styles/style.css">
</head>

<body>

  <a href="#main" class="skip-link">Skip to content</a>

  <header>
    <h1>Book & Notes Vault</h1>
  </header>

  <nav>

    <a href="records.html" class="nav-link">Records</a>
    <a href="add.html" class="nav-link">Add Book</a>

  <main id="main">

    <section id="records">
      <h2>Records</h2>
      <div class="controls-bar">
        <input type="text" id="searchInput" placeholder="Search" aria-label="Search Records">
        <div class="sort-controls">
          <label for="sortBy">Sort by:</label>
          <select id="sortBy">
            <option value="dateAdded">Date Added</option>
            <option value="title">Title (A-Z)</option>
            <option value="pages">Pages (Low-High)</option>
          </select>
        </div>
      </div>
      <div id="recordsGrid"></div>
    </section>

  </main>

    <p>© 2026 Book Vault</p>
  </footer>

  <script type="module" src="scripts/main.js"></script>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Book - Book & Notes Vault</title>
  <link rel="stylesheet" href="styles/style.css">
</head>

<body>

  <a href="#main" class="skip-link">Skip to content</a>

  <header>
    <h1>Book & Notes Vault</h1>
  </header>

  <nav>
    <a href="index.html" class="nav-link">Dashboard</a>
    <a href="records.html" class="nav-link">Records</a>
    <a href="add.html" class="nav-link">Add Book</a>
    <a href="settings.html" class="nav-link">Settings</a>
    <a href="about.html" class="nav-link">About</a>
  </nav>

  <main id="main">

    <section id="form">
      <h2>Add Book</h2>
      <form id="bookForm">
        <label for="title">Title</label>
        <input type="text" id="title" required>
        <label for="author">Author</label>
        <input type="text" id="author" required>
        <label for="pages">Pages</label>
        <input type="number" id="pages" required>
        <label for="tag">Tag</label>
        <input type="text" id="tag" required>
        <label for="dateAdded">Date Added</label>
        <input type="date" id="dateAdded" required>
        <button type="submit">Save Book</button>
        <p id="formMsg" role="status" aria-live="assertive"></p>
      </form>
    </section>

  </main>

  <footer>
    <p>© 2026 Book Vault</p>
  </footer>

  <script type="module" src="scripts/main.js"></script>
</body>

</html>
